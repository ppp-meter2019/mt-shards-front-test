# Frontend (SPA) server — sits BEHIND the AWS ALB.
#
# Topology (two-port design):
#   ALB :443 listener  -> frontend target group  -> THIS nginx (port 80)   [SPA only]
#   ALB :8000 listener -> backend  target group  -> gunicorn               [API + admin]
#
# Consequences for this config:
#   * The ALB terminates TLS and forwards plain HTTP to us on :80 — so we
#     listen on 80, NOT 443, and we do NOT redirect to https (that is the ALB's
#     job; we always receive http here).
#   * We never proxy /api or /admin. They live on the :8000 listener (backend).
#     The SPA calls the API cross-origin at https://<host>:8000/api/... — see
#     tenants_front/config.js (API_PORT = "8000").
#   * This box only serves the static SPA: index.html, config.js, style.css, js/.

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;          # ALB routes by listener; the original Host is
                            # forwarded and read client-side (window.location)
                            # for tenant detection — nginx doesn't need it.

    root  /home/ubuntu/tenants_front;
    index index.html;

    access_log /var/log/nginx/frontend.access.log;
    error_log  /var/log/nginx/frontend.error.log;

    client_max_body_size 1m;   # static only; no uploads here

    # --- optional: log real client IPs coming through the ALB ---
    # set_real_ip_from <vpc-cidr-or-alb-subnet>;   # e.g. 10.0.0.0/16
    # real_ip_header   X-Forwarded-For;
    # real_ip_recursive on;

    # Cheap liveness for the ALB frontend target-group health check.
    # Point the target group's health check at /healthz (HTTP:80, matcher 200).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    gzip            on;
    gzip_comp_level 5;
    gzip_types      text/css application/javascript image/svg+xml application/json;

    # index.html and config.js must NEVER be cached, so a new deploy or a
    # config change (API_PORT / APP_DOMAIN) takes effect immediately.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /config.js  { add_header Cache-Control "no-store"; }

    # SPA assets. No content-hashing in this MVP, so revalidate every time
    # (ETag/Last-Modified) rather than serve stale JS/CSS.
    location ~* \.(js|css|svg|png|jpe?g|gif|ico|woff2?)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: any unknown path returns index.html (client-side routing).
    location / {
        add_header Cache-Control "no-store";   # covers "/" -> index.html
        try_files $uri $uri/ /index.html;
    }
}
